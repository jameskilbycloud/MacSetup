name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ShellCheck + bash syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash -n (parse check)
        run: |
          set -e
          shopt -s nullglob
          for f in *.sh server/*.sh; do
            echo "Parsing $f"
            bash -n "$f"
          done
        shell: bash

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        env:
          # SC1091: don't follow sourced files (lib.sh resolution happens at runtime).
          SHELLCHECK_OPTS: -e SC1091
        with:
          severity: warning
          scandir: .

  brew-validate:
    name: Validate Homebrew packages
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # The lint job runs on Ubuntu (bash 5), so it cannot catch constructs that
      # break on the bash 3.2 macOS actually ships — e.g. `declare -A`. Parse
      # every script with /bin/bash explicitly to cover a factory-fresh Mac.
      - name: bash 3.2 parse check (/bin/bash)
        run: |
          set -e
          /bin/bash --version | head -1
          shopt -s nullglob
          for f in *.sh server/*.sh; do
            echo "Parsing $f with /bin/bash"
            /bin/bash -n "$f"
          done
        shell: bash

      - name: Tap HashiCorp (required for packer/terraform/vault)
        run: brew tap hashicorp/tap

      - name: Validate formulas (brew.sh + server/brew-server.sh)
        run: |
          set -euo pipefail

          # Pull the quoted entries out of a package-list function body. Only
          # lines that are *just* a quoted string match, so inline comments and
          # log_* calls in the same function are ignored.
          extract() {
            awk "/^$2\(\) \{/,/^\}/" "$1" \
              | grep -E '^[[:space:]]+"[a-z0-9/-]+"' \
              | grep -oE '"[a-z0-9/-]+"' \
              | tr -d '"'
          }

          formulas=$(
            extract brew.sh install_formulas
            extract server/brew-server.sh install_formulas
          )

          if [[ -z "$formulas" ]]; then
            echo "::error::Could not extract any formulas — the parser is stale"
            exit 1
          fi

          missing=()
          for f in $(echo "$formulas" | sort -u); do
            if brew info --formula "$f" >/dev/null 2>&1; then
              echo "  ok  $f"
            else
              echo "  MISSING  $f"
              missing+=("$f")
            fi
          done

          if (( ${#missing[@]} )); then
            printf '::error::Unknown formula: %s\n' "${missing[@]}"
            exit 1
          fi

      - name: Validate casks (brew-apps.sh + server/brew-server.sh)
        run: |
          set -euo pipefail

          extract() {
            awk "/^$2\(\) \{/,/^\}/" "$1" \
              | grep -E '^[[:space:]]+"[a-z0-9-]+"' \
              | grep -oE '"[a-z0-9-]+"' \
              | tr -d '"'
          }

          casks=$(
            extract brew-apps.sh install_cask_apps
            extract server/brew-server.sh install_casks
          )

          if [[ -z "$casks" ]]; then
            echo "::error::Could not extract any casks — the parser is stale"
            exit 1
          fi

          missing=()
          for c in $(echo "$casks" | sort -u); do
            if brew info --cask "$c" >/dev/null 2>&1; then
              echo "  ok  $c"
            else
              echo "  MISSING  $c"
              missing+=("$c")
            fi
          done

          if (( ${#missing[@]} )); then
            printf '::error::Unknown cask: %s\n' "${missing[@]}"
            exit 1
          fi
