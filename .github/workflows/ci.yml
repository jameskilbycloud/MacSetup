name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ShellCheck + bash syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash -n (parse check)
        run: |
          set -e
          shopt -s nullglob
          for f in *.sh; do
            echo "Parsing $f"
            bash -n "$f"
          done
        shell: bash

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        env:
          # SC1091: don't follow sourced files (lib.sh resolution happens at runtime).
          SHELLCHECK_OPTS: -e SC1091
        with:
          severity: warning
          scandir: .

  brew-validate:
    name: Validate Homebrew packages
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tap HashiCorp (required for packer/terraform/vault)
        run: brew tap hashicorp/tap

      - name: Validate formulas in brew.sh
        run: |
          set -euo pipefail

          formulas=$(awk '/^install_formulas\(\) \{/,/^\}/' brew.sh \
            | grep -E '^[[:space:]]+"[a-z0-9/-]+"' \
            | grep -oE '"[a-z0-9/-]+"' \
            | tr -d '"')

          if [[ -z "$formulas" ]]; then
            echo "::error::Could not extract any formulas from brew.sh — parser is stale"
            exit 1
          fi

          missing=()
          for f in $formulas; do
            if brew info --formula "$f" >/dev/null 2>&1; then
              echo "  ok  $f"
            else
              echo "  MISSING  $f"
              missing+=("$f")
            fi
          done

          if (( ${#missing[@]} )); then
            printf '::error::Unknown formula: %s\n' "${missing[@]}"
            exit 1
          fi

      - name: Validate casks in brew-apps.sh
        run: |
          set -euo pipefail

          casks=$(awk '/^install_cask_apps\(\) \{/,/^\}/' brew-apps.sh \
            | grep -E '^[[:space:]]+"[a-z0-9-]+"' \
            | grep -oE '"[a-z0-9-]+"' \
            | tr -d '"')

          if [[ -z "$casks" ]]; then
            echo "::error::Could not extract any casks from brew-apps.sh — parser is stale"
            exit 1
          fi

          missing=()
          for c in $casks; do
            if brew info --cask "$c" >/dev/null 2>&1; then
              echo "  ok  $c"
            else
              echo "  MISSING  $c"
              missing+=("$c")
            fi
          done

          if (( ${#missing[@]} )); then
            printf '::error::Unknown cask: %s\n' "${missing[@]}"
            exit 1
          fi
